<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sophie's Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="shared/style.css">
<style>
.subject{display:flex; gap:16px; align-items:center; text-decoration:none; color:var(--ink); min-height:120px}
.subject .icon{flex:none; width:64px; height:64px; border-radius:20px; display:grid; place-items:center; font-size:1.9em; font-weight:800}
.subject .info{display:flex; flex-direction:column; gap:4px; min-width:0}
.subject .info b{font-size:1.2em}
.subject.maths .icon{background:var(--teal-soft); color:var(--teal)}
.subject.history .icon{background:var(--berry-soft); color:var(--berry)}
.startchip{align-self:flex-start; background:var(--sun); color:var(--sun-ink); border-radius:999px; padding:2px 12px; font-size:.75em; font-weight:800}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Landing page: one card per subject. Each app saves a short summary (cards due, XP, streak) that this page reads. */
const SUBJECTS = [
  {id: "maths", name: "Maths", href: "maths/", icon: "÷", about: "Ratio and Proportion, plus any topics you add."},
  {id: "history", name: "History", href: "history/", icon: "H", about: "Edexcel. Weimar and Nazi Germany, 1918–39."}
];
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const st = Object.assign({tint: "cream", size: "l", spacing: false, theme: "auto"}, read("sgr-settings") || {});
const root = document.documentElement;
root.setAttribute("data-tint", st.tint);
root.setAttribute("data-size", st.size);
root.setAttribute("data-spacing", st.spacing ? "wide" : "normal");
if (st.theme !== "auto") root.setAttribute("data-theme", st.theme);

const sums = SUBJECTS.map(s => Object.assign({}, s, {sum: read("sgr-sum-" + s.id)}));
const streak = Math.max(0, ...sums.map(s => (s.sum && s.sum.streak) || 0));
const xp = sums.reduce((n, s) => n + ((s.sum && s.sum.xp) || 0), 0);
const started = sums.filter(s => s.sum);
// Suggest the subject with the most cards waiting; if nothing has been started, suggest nothing.
const best = started.filter(s => s.sum.due > 0).sort((a, b) => b.sum.due - a.sum.due)[0];

function status(s){
  if (!s.sum) return "Not started yet. Tap to begin.";
  const due = s.sum.due ? `${s.sum.due} card${s.sum.due === 1 ? "" : "s"} ready to check` : "All cards checked for now";
  const exam = s.sum.examTotal ? ` · Exam practice ${s.sum.exam} of ${s.sum.examTotal}` : "";
  return due + exam;
}

document.getElementById("app").innerHTML = `
  <header class="bar">
    <span class="brand" style="cursor:default"><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span>Sophie's Revision</span></span>
    <span class="chip" title="Best run of days in a row">🔥 <span>${streak} day${streak === 1 ? "" : "s"}</span></span>
    <span class="chip" title="XP across all subjects">⭐ <span>${xp} XP</span></span>
  </header>
  <div class="mission"><div class="txt"><span class="eyebrow">Hello, Sophie</span><h1>What shall we revise today?</h1>
    <p class="muted">${best ? `${esc(best.name)} has the most cards waiting. A short game there is a good place to start.` : started.length ? "Everything is checked for now. You can practise anything you like." : "Pick a subject to start. Each one remembers where you got to."}</p></div></div>
  <section class="sheet"><h2>My subjects</h2>
    <div class="grid">${sums.map(s => `<a class="deck subject ${s.id}" href="${s.href}"><span class="icon" aria-hidden="true">${esc(s.icon)}</span><span class="info">${best && best.id === s.id ? `<span class="startchip">Start here</span>` : ""}<b>${esc(s.name)}</b><span class="small muted">${esc(s.about)}</span><span class="small">${esc(status(s))}</span></span></a>`).join("")}</div>
  </section>
  <div class="calm"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg><p>Little and often works best. One short game a day keeps your memory strong. Your settings for colours, text size and spacing are shared by every subject.</p></div>
  <p class="small muted">Progress is saved in this browser on this device. Each subject has a backup button in its settings.</p>`;
</script>
</body>
</html>
